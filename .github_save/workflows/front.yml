name: Front CI

on:
  pull_request:
      types: ['opened', 'edited', 'reopened', 'synchronize']
  push:
    branches:
      - master
    paths:
      - front/**

defaults:
  run:
    shell: bash
    working-directory: ./front

jobs:
  lint:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v2.3.4
    - uses: actions/cache@v2.1.6
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-modules-
    - name: Use Node.js
      uses: actions/setup-node@v2.1.5
      with:
        node-version: 16
    - run: yarn --pure-lockfile
    - run: yarn run lint

  build:
    runs-on: ubuntu-20.04
    needs: [lint]
    steps:
    - uses: actions/checkout@v2.3.4
    - name: Use Node.js
      uses: actions/setup-node@v2.1.5
      with:
        node-version: 14
    - run: yarn --pure-lockfile
    - run: yarn run build
