version: "3"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - ./db/data:/var/lib/postgresql/data
    - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: db:5432
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_SCHEMA: public
      DB_PASSWORD: LAYDxZjDu3zzVxiOj9iJGKjvnd4gOznhM
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: 9oFJfc7Vl0AAsGKJCeeGx6MRBcw6IsM99
    depends_on:
      - db
    labels:
      - "traefik.http.routers.keycloak.rule=Host(`oauth.coco-erp.fr`)"
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=cocoresolver"


  pdf:
    image: thecodingmachine/gotenberg:6
    environment:
      DEFAULT_WAIT_TIMEOUT: "30"

  back:
    image: maliszewskid/compta-back:latest
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db/compta?currentSchema=compta
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://db/compta?currentSchema=compta
      QUARKUS_DATASOURCE_USERNAME: compta
      QUARKUS_DATASOURCE_PASSWORD: Mg2zsr8GVSbtFuP7Nbmt069nNpkfqawrd
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_HEADERS: "Authorization,Content-Type,Accept"
      QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/compta
      PDF_SERVICE_API_MP_REST_URL: http://pdf:3000
      PDF_SERVICE_API_MP_REST_SCOPE: javax.inject.Singleton
    labels:
      - "traefik.http.routers.compta-back.rule=Host(`api.coco-erp.fr`)"
      - "traefik.enable=true"
      - "traefik.http.routers.compta-back.entrypoints=websecure"
      - "traefik.http.routers.compta-back.tls.certresolver=cocoresolver"

  front:
    image: maliszewskid/compta-front:latest
    volumes:
    - ./keycloak.json:/usr/share/nginx/html/keycloak.json
    - ./config.js:/usr/share/nginx/html/config.js
  labels:
      - "traefik.http.routers.compta-front.rule=Host(`app.coco-erp.fr`)"
      - "traefik.http.routers.compta-front.entrypoints=websecure"
      - "traefik.http.routers.compta-front.tls.certresolver=cocoresolver"
      - "traefik.enable=true"


  reverse-proxy:
    # The official v2 Traefik docker image
    image: traefik:v2.3
    # Enables the web UI and tells Traefik to listen to docker
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cocoresolver.acme.tlschallenge=true"
      #- "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.cocoresolver.acme.email=maliszewskid3@gmail.com"
      - "--certificatesresolvers.cocoresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      # The HTTP port
      - "80:80"
      - "443:443"
      # The Web UI (enabled by --api.insecure=true)
      # - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt

networks:
  default:
    external:
      name: traefik
