info:
  contact: {}
paths:
  /bill-customization:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Liste des personnalisations
          schema:
            items:
              $ref: '#/definitions/BillCustomizationResponse'
            type: array
        "401":
          description: Non autorisé
          schema:
            type: string
      summary: Récupère toutes les personnalisations de factures
      tags:
      - Bill Customization
    post:
      consumes:
      - application/json
      parameters:
      - description: Données de la personnalisation
        in: body
        name: customization
        required: true
        schema:
          $ref: '#/definitions/BillCustomizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Personnalisation créée
          schema:
            $ref: '#/definitions/BillCustomizationResponse'
        "400":
          description: Corps mal formé
          schema:
            type: string
        "401":
          description: Non autorisé
          schema:
            type: string
      summary: Crée une personnalisation de facture
      tags:
      - Bill Customization
  /bill-customization/{id}:
    delete:
      parameters:
      - description: ID de la personnalisation
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Personnalisation supprimée
          schema:
            type: string
        "400":
          description: Aucun ID fourni
          schema:
            type: string
        "401":
          description: Non autorisé
          schema:
            type: string
      summary: Supprime une personnalisation de facture
      tags:
      - Bill Customization
    get:
      parameters:
      - description: ID de la personnalisation
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Personnalisation de facture
          schema:
            $ref: '#/definitions/BillCustomizationResponse'
        "400":
          description: Aucun ID fourni
          schema:
            type: string
        "401":
          description: Non autorisé
          schema:
            type: string
      summary: Récupère une personnalisation de facture par ID
      tags:
      - Bill Customization
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID de la personnalisation
        in: path
        name: id
        required: true
        type: string
      - description: Données de la personnalisation
        in: body
        name: customization
        required: true
        schema:
          $ref: '#/definitions/BillCustomizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Personnalisation mise à jour
          schema:
            $ref: '#/definitions/BillCustomizationResponse'
        "400":
          description: Aucun ID fourni ou corps mal formé
          schema:
            type: string
        "401":
          description: Non autorisé
          schema:
            type: string
      summary: Met à jour une personnalisation de facture
      tags:
      - Bill Customization
  /bill-customization/mine:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Personnalisation de facture
          schema:
            $ref: '#/definitions/BillCustomizationResponse'
        "401":
          description: Non autorisé
          schema:
            type: string
        "409":
          description: Aucune entreprise associée
          schema:
            type: string
      summary: Récupère la personnalisation de facture de l'utilisateur
      tags:
      - Bill Customization
  /bill-email-customization:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: List of email customizations
          schema:
            items:
              $ref: '#/definitions/BillEmailCustomizationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Retrieves all bill email customizations
      tags:
      - Bill Email Customization
    post:
      consumes:
      - application/json
      parameters:
      - description: Customization data
        in: body
        name: customization
        required: true
        schema:
          $ref: '#/definitions/BillEmailCustomizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created customization
          schema:
            $ref: '#/definitions/BillEmailCustomizationResponse'
        "400":
          description: Malformed body
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Creates a bill email customization
      tags:
      - Bill Email Customization
  /bill-email-customization/{id}:
    delete:
      parameters:
      - description: Customization ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Customization deleted
          schema:
            type: string
        "400":
          description: No ID provided
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Deletes a bill email customization
      tags:
      - Bill Email Customization
    get:
      parameters:
      - description: Customization ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Email customization by ID
          schema:
            $ref: '#/definitions/BillEmailCustomizationResponse'
        "400":
          description: No ID provided
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Retrieves a bill email customization by ID
      tags:
      - Bill Email Customization
    patch:
      consumes:
      - application/json
      parameters:
      - description: Customization ID
        in: path
        name: id
        required: true
        type: string
      - description: Customization data
        in: body
        name: customization
        required: true
        schema:
          $ref: '#/definitions/BillEmailCustomizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated customization
          schema:
            $ref: '#/definitions/BillEmailCustomizationResponse'
        "400":
          description: No ID provided or malformed body
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Updates a bill email customization
      tags:
      - Bill Email Customization
  /bill-email-customization/mine:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: User's email customization
          schema:
            $ref: '#/definitions/BillEmailCustomizationResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "409":
          description: No company associated
          schema:
            type: string
      summary: Retrieves the user's bill email customization
      tags:
      - Bill Email Customization
  /bills:
    get:
      parameters:
      - description: Filter by criteria (e.g., 'not_paid')
        in: query
        name: filter
        type: string
      - collectionFormat: csv
        description: Filter by status (e.g., ['PAID', 'UNPAID'])
        in: query
        items:
          type: string
        name: status
        type: array
      - collectionFormat: csv
        description: Exclude specific statuses (e.g., ['CANCELED'])
        in: query
        items:
          type: string
        name: not_status
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: List of bills
