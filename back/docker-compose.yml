version: "3"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - devData:/var/lib/postgresql/data
      - ../db/init-db.sh:/docker-entrypoint-initdb.d/init.sh

  auth:
    env_file:
      - ../.env
    build:
      context: ../auth
      dockerfile: ./Dockerfile
    ports:
      - 8090:8090

  back:
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
    ports:
      - 8080:8080
    volumes:
      - ./:/app
      - ./generated:/upload
    env_file:
      - ../.env

volumes:
  devData:
