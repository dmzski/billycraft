version: "3"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
    - 5432:5432
    volumes:
    - ./db/data:/var/lib/postgresql/data
    - ./db/init-db.sh:/docker-entrypoint-initdb.d/init.sh

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: db:5432
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_SCHEMA: public
      DB_PASSWORD: keycloak
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
    depends_on:
      - db
    labels:
      - "traefik.http.routers.keycloak.rule=Host(`oauth.coco-erp.lan`)"
      - "traefik.enable=true"
      - "traefik.http.middlewares.keycloak.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.keycloak.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.keycloak.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.keycloak.headers.addvaryheader=true"

  pdf:
    image: thecodingmachine/gotenberg:6
    ports:
    - 8091:3000
    environment:
      DEFAULT_WAIT_TIMEOUT: "30"
    links:
      - "reverse-proxy:api.coco-erp.lan"

  back:
    image: compta-back:latest
    build:
      dockerfile: ./src/main/docker/Dockerfile.native
      context: ./
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db/compta?currentSchema=compta
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://db/compta?currentSchema=compta
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_HEADERS: "Authorization,Content-Type,Accept"
      QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/auth/realms/compta
      PDF_SERVICE_API_MP_REST_URL: http://pdf:3000
      PDF_SERVICE_API_MP_REST_SCOPE: javax.inject.Singleton
      COMPTA_UPLOAD_DIR: /uploads
      COMPTA_BASE_URL: http://api.coco-erp.lan
      QUARKUS_MAILER_HOST: mailserver
    volumes:
      - ./uploads:/uploads
    labels:
      - "traefik.http.routers.back.rule=Host(`api.coco-erp.lan`)"
      - "traefik.enable=true"
      - "traefik.http.middlewares.back.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.back.headers.accesscontrolalloworiginlist=http://localhost:3000"
      - "traefik.http.middlewares.back.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.back.headers.addvaryheader=true"

  mailserver:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  reverse-proxy:
    # The official v2 Traefik docker image
    image: traefik:v2.3
    # Enables the web UI and tells Traefik to listen to docker
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      # - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock

