# Configuration file

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres


quarkus.datasource.reactive=true
quarkus.datasource.reactive.url=postgresql://localhost:5432/compta
quarkus.datasource.reactive.max-size=20

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/compta?currentSchema=compta
quarkus.datasource.jdbc.min-size=4
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.physical-naming-strategy=com.coco.back.main.CustomPhysicalNamingStrategy

quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.clean-at-start=false


# OIDC Configuration
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=http://oauth.coco-erp.lan/auth/realms/compta
quarkus.oidc.client-id=api
quarkus.oidc.credentials.secret=f833dfef-ba82-488c-b549-c56e7ef59583

# Custom
tenant.properties.path=/home/dorian/Projects/Perso/compta/back/src/main/resources/tenant.properties

compta.upload-dir=/tmp/compta
compta.base-url=http://localhost:8080

quarkus.http.cors=true
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Content-Disposition,accept-language
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.origins=*
quarkus.http.limits.max-body-size=200M
quarkus.http.body.handle-file-uploads=true

#pdf-service-api
pdf-service-api/mp-rest/url=http://localhost:8091
pdf-service-api/mp-rest/scope=javax.inject.Singleton

## Mailer
quarkus.mailer.from=no-reply@coco-erp.fr
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.ssl=false
quarkus.mailer.username=test
quarkus.mailer.password=test
quarkus.mailer.mock=false

quarkus.native.additional-build-args=\
  -H:IncludeResourceBundles=sun.util.resources.TimeZoneNames
