version: "3"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh

  keycloak:
    image: quay.io/keycloak/keycloak:13.0.1
    env_file:
      - ./keycloak.env
    volumes:
      - ./theme:/opt/jboss/keycloak/themes/coco-erp
    depends_on:
      - db
    labels:
      - "traefik.http.routers.keycloak.rule=Host(`oauth.coco-erp.fr`)"
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=cocoresolver"
      - "traefik.http.middlewares.keycloak.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.keycloak.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.keycloak.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.keycloak.headers.addvaryheader=true"

  back:
    image: maliszewskid/compta-back:v2
    env_file:
      - ./prod.env
    volumes:
      - ./uploads:/uploads
    labels:
      - "traefik.http.routers.compta-back.rule=Host(`api.coco-erp.fr`)"
      - "traefik.enable=true"
      - "traefik.http.routers.compta-back.entrypoints=websecure"
      - "traefik.http.routers.compta-back.tls.certresolver=cocoresolver"
      - "traefik.http.middlewares.compta-back.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.compta-back.headers.accesscontrolalloworiginlist=https://stg.app.coco-pbx.fr/"
      - "traefik.http.middlewares.compta-back.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.compta-back.headers.addvaryheader=true"

  front:
    image: maliszewskid/compta-front:v2
    volumes:
      - ./keycloak.json:/usr/share/nginx/html/keycloak.json
      - ./config.js:/usr/share/nginx/html/conf.js
    labels:
      - "traefik.http.routers.compta-front.rule=Host(`stg.app.coco-pbx.fr`)"
      - "traefik.http.routers.compta-front.entrypoints=websecure"
      - "traefik.http.routers.compta-front.tls.certresolver=cocoresolver"
      - "traefik.enable=true"
      - "traefik.http.middlewares.compta-front.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.compta-front.headers.accesscontrolalloworiginlist=https://stg.app.coco-pbx.fr/"
      - "traefik.http.middlewares.compta-front.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.compta-front.headers.addvaryheader=true"

  reverse-proxy:
    # The official v2 Traefik docker image
    image: traefik:v2.3
    # Enables the web UI and tells Traefik to listen to docker
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cocoresolver.acme.tlschallenge=true"
      #- "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.cocoresolver.acme.email=maliszewskid3@gmail.com"
      - "--certificatesresolvers.cocoresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      # The HTTP port
      - "80:80"
      - "443:443"
      # The Web UI (enabled by --api.insecure=true)
      # - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt

networks:
  default:
    external:
      name: traefik