version: "3"

services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - dbData:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    env_file:
      - ./docker.env

  auth:
    depends_on:
      - postgres
    env_file:
      - ./docker.env
    image: coco-erp/auth:local
    ports:
      - 8090:8090
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.coco-erp.lan`)"
      - "traefik.http.middlewares.auth.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.auth.headers.accesscontrolalloworiginlist=http://localhost:3000"
      - "traefik.http.middlewares.auth.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.auth.headers.addvaryheader=true"


  reverse-proxy:
    # The official v2 Traefik docker image
    image: traefik:v2.3
    # Enables the web UI and tells Traefik to listen to docker
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  dbData:
