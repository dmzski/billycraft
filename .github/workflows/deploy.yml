name: Deploy

on:
  push:
    branches:
      - master

jobs:

  check-front-files:
    name: Check front files
    outputs:
      run_job: ${{ steps.check_files.outputs.run_job }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: check modified files
        id: check_files
        run: |
          git diff --name-only HEAD^ HEAD
          git diff --name-only HEAD^ HEAD > files.txt
          while IFS= read -r file
          do
            echo $file
            if [[ $file != front/* ]]; then
              echo "::set-output name=run_job::false"
            else
              echo "::set-output name=run_job::true"
              break
            fi
          done < files.txt

  check-back-files:
    name: Check back files
    outputs:
      run_job: ${{ steps.check_files.outputs.run_job }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 2

      - name: check modified files
        id: check_files
        run: |
          git diff --name-only HEAD^ HEAD
          git diff --name-only HEAD^ HEAD > files.txt
          while IFS= read -r file
          do
            echo $file
            if [[ $file != back/* ]]; then
              echo "::set-output name=run_job::false"
            else
              echo "::set-output name=run_job::true"
              break
            fi
          done < files.txt

  push-front:
    defaults:
      run:
        shell: bash
        working-directory: ./front
    runs-on: ubuntu-20.04
    needs: [check-front-files]
    if: needs.check-front-files.outputs.run_job == 'true'
    env:
      GIT_COMMITTER_NAME: Coco Bot
      GIT_COMMITTER_EMAIL: contact@coco-erp.fr
    steps:
    - uses: actions/checkout@v2
    - run: git fetch --prune --unshallow --tags

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Use Node.js
      uses: actions/setup-node@v2.1.5
      with:
        node-version: 16
    - run: yarn --pure-lockfile
    - run: yarn run semantic-release
      env:
        HUSKY: 0
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

  push-back:
    defaults:
      run:
        shell: bash
        working-directory: ./back
    runs-on: ubuntu-20.04
    needs: [check-back-files]
    if: needs.check-back-files.outputs.run_job == 'true'
    steps:
    - uses: actions/checkout@v2
    - run: git fetch --prune --unshallow --tags
    - name: Configure Git user
      run: |
        git config user.email "contact@coco-erp.fr"
        git config user.name "Coco Bot"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - uses: docker/login-action@v1
      name: Login Docker Hub
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Cache Maven packages
      uses: actions/cache@v2
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        server-id: github

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: "Maven release"
      run: ./mvnw -B release:prepare -Dusername=$GITHUB_ACTOR -Dpassword=$GITHUB_TOKEN
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

