version: "3"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - coco_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init.sh

  db-migrator:
    image: billycraft/auth-migrator:local
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_started

  auth:
    env_file:
      - ./.env
    image: billycraft/auth:local
    volumes:
      - ./auth:/app
    ports:
      - 8090:8080
    depends_on:
      db-migrator:
        condition: service_completed_successfully

  api:
    image: billycraft/api:local
    volumes:
      - ./back:/app
      - coco_uploads:/upload
    ports:
      - 8091:8080
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_started

  pdf:
    image: gotenberg/gotenberg:8

networks:
  default:
    name: coco_net

volumes:
  coco_data:
  coco_uploads:
