version: "3"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - cocoData:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh
      - ./auth/migrations:/docker-entrypoint-initdb.d/auth/

  auth:
    env_file:
      - ./.env
    image: coco-erp/auth:local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.coco-erp.lan`)"
      - "traefik.http.middlewares.auth.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.auth.headers.accesscontrolalloworiginlist=http://localhost:3000"
      - "traefik.http.middlewares.auth.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.auth.headers.addvaryheader=true"

  api:
    image: coco-erp/api:local
    volumes:
      - ./back:/app
      - ./upload:/upload
    env_file:
      - ./.env
    links:
      - "reverse-proxy:auth.coco-erp.lan"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.coco-erp.lan`)"
      - "traefik.http.middlewares.api.forwardauth.address=http://auth.coco-erp.lan/api/auth/check"
      - "traefik.http.middlewares.api.forwardauth.authResponseHeaders=X-Auth-User"
      - "traefik.http.middlewares.api.headers.accesscontrolallowmethods=GET,POST,PATCH,HEAD,DELETE,OPTIONS,PUT"
      - "traefik.http.middlewares.api.headers.accesscontrolalloworiginlist=http://localhost:3000"
      - "traefik.http.middlewares.api.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.api.headers.addvaryheader=true"

  reverse-proxy:
    # The official v2 Traefik docker image
    image: traefik:v2.3
    # Enables the web UI and tells Traefik to listen to docker
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      # - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  cocoData:
