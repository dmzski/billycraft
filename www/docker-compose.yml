version: "3.8"

services:
  web:
    image: nginx
    volumes:
      - ./src:/usr/share/nginx/html
    labels:
      - "traefik.http.routers.website.rule=Host(`coco-erp.fr`) || Host(`www.coco-erp.fr`)"
      - "traefik.enable=true"
      - "traefik.http.middlewares.website.headers.accesscontrolallowmethods=GET,OPTIONS"
      - "traefik.http.middlewares.website.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.website.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.website.headers.addvaryheader=true"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls.certresolver=cocoresolver"

networks:
  default:
    external:
      name: traefik
