parent=base

styles=css/main.css css/login.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=login-pf
kcBodyClass=pt-5
kcLoginClass=flex flex-col justify-center items-center mx-2
kcFormHeaderClass=text-center text-2xl font-bold
kcFormCardClass=flex flex-col p-5 rounded-md shadow-lg bg-white xs:w-full md:w-2/3 lg:w-1/3 xl:w-1/3 w-full
kcFormLoginClass=flex flex-col 
kcFormGroupClass=flex flex-col w-full my-2 justify-center items-center
kcLabelClass=w-full text-gray-700
kcInputClass=w-full bg-gray-200 border-2 border-gray-400 text-gray-700 outline-none rounded py-2 px-3
kcButtonLargeClass=px-5 py-3
kcFormButtonsClass=w-full my-2


#Buttons
kcButtonClass=outline-none cursor-pointer px-2 py-1 rounded uppercase w-full
kcButtonPrimaryClass=text-purple-600 bg-white border border-purple-600 hover:bg-purple-600 hover:text-white shadow hover:shadow-md active:bg-purple-700 focus:bg-purple-700 font-bold
kcButtonSecondaryClass=border border-gray-600 text-gray-600

kcFormOptionsClass=w-full
kcRememberMe=text-gray-700 w-full
kcForgotPassword=text-gray-700 underline text-right text-sm
kcRegisterClass=outline-none cursor-pointer px-2 py-1 rounded w-full text-center text-gray-700 underline

kcLabelWrapperClass=w-full py-1 px-2
kcInputWrapperClass=w-full

kcLogoLink=http://www.keycloak.org

kcLogoClass=login-pf-brand

kcContainerClass=container-fluid
kcContentClass=col-sm-8 col-sm-offset-2 col-md-6 col-md-offset-3 col-lg-6 col-lg-offset-3
kcContentWrapperClass=row

kcHeaderClass=login-pf-page-header
kcFeedbackAreaClass=col-md-12
kcLocaleClass=col-xs-12 col-sm-1
kcAlertIconClasserror=pficon pficon-error-circle-o

